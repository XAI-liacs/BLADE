[project]
name = "iohblade"
version = "1.2.0"
description = "Benchmarking Llm Assisted Design and Evolution of algorithms."
authors = [{ name = "Niki van Stein", email = "n.van.stein@liacs.leidenuniv.nl" }]
requires-python = ">=3.11.5, <4"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2.3,<3",
    "openai>=1.99.1,<4",
    "anthropic>=2.1.0,<3",
    "ollama>=0.5.3,<1",
    "jsonlines>=4.0.0,<5",
    "google-genai>=1,<4",
    "joblib>=1.4.2,<2",
    "tokencost>=0.1.26,<0.2",
    "llamea>=1.5.0,<2",
    "mlflow>=3.1.0,<4",
    "python-constraint2>=2.2.3,<3",
    "xmltodict>=0.14.2,<2",
    "streamlit>=1.49.0,<2",
    "jsonschema>=4.24.0,<5",
    "plotly>=6.2.0",
    "ioh>=0.3.22",
    "seaborn>=0.13.2",
    "lizard>=1.17.31",
    "networkx>=3.5",
    "virtualenv>=20.34.0",
    "feedparser>=6.0.12",
    "py-cpuinfo",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/XAI-liacs/BLADE"
Repository = "https://github.com/XAI-liacs/BLADE"

[project.scripts]
iohblade-webapp = "iohblade.webapp:main"
iohblade = "iohblade.cli:main"

[dependency-groups]
dev = [
    "black>=25.11.0,<27",
    "isort>=5.12.0,<10",
    "pytest>=7.4.3,<10",
    "jupyter>=1.0.0,<2",
    "pytest-cov>=4.1.0,<8",
    "codecov>=2.1.13,<3",
    "pytest-mock>=3.14.0,<4",
    "ipykernel>=6.29.5,<8",
]
docs = [
    "sphinx>=9.0.4,<10",
    "sphinx-rtd-theme>=3.0.2,<4",
    "myst-parser>=5.2.0,<6",
    "nbsphinx>=0.9.6,<0.10",
    "pandoc~=2.4",
    "furo>=2024.8.6,<2026",
    "sphinxext-opengraph>=0.9.1,<0.14",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-multiversion-scylla>=0.3.9,<0.4",
    "sphinx-design>=0.6.1,<0.8",
]
methods = [
    "eoh",
    "pymoo",
    "reevo",
    "codebleu",
    "tree-sitter-python"
]
extraproblems = [
    "pymoosh==4.0.1",
    "openml>=0.14",
]
apple-silicon = [
    "lmstudio>=1.5.0,<2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx_lm>=0.30.2,<1; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

kerneltuner = [
    "kernel-tuner",
    "autotuning_methodology",
]
trackio = [
    "trackio>=0.3.2,<1",
]
# smac in BLADE's own environment, only needed to call iohblade.hpo.run_smac
# directly: problems tune in their evaluation environments, which install
# iohblade.hpo.HPO_DEPENDENCIES themselves when HPO is enabled.
hpo = [
    "smac>=2.4.1,<2.5",
]

[tool.uv]
default-groups = [
    "methods",
]

[tool.uv.sources]
eoh = { git = "https://github.com/nikivanstein/EoH", subdirectory = "eoh" , rev = "f0d21b2f2f62c452bac545fd7f68d3af50845321"}
reevo = { git = "https://github.com/nikivanstein/reevo.git", rev = "main" }
kernel-tuner = { git = "https://github.com/KernelTuner/kernel_tuner.git", rev = "ad41cfe99aec44c99ae79b4ececcc7227eb20db2" }
autotuning_methodology = { git = "https://github.com/AutoTuningAssociation/autotuning_methodology.git", rev = "5536c5a4a82fa6f3f14d36e38b8e32baf00b6347" }
codebleu = { git = "https://github.com/anantashahane/codebleu", rev="main"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iohblade"]
include = [
  "iohblade/.streamlit/*",
]


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning",
]

[tool.isort]
profile = "black"
